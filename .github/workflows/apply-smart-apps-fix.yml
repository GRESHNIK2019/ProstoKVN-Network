name: Apply Smart Apps Fix

on:
  push:
    branches:
      - fix/smart-ubisoft-app-manager
    paths:
      - tools/apply_smart_apps_fix.py
      - .github/workflows/apply-smart-apps-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/smart-ubisoft-app-manager

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply changes
        run: |
          python tools/apply_smart_apps_fix.py
          python scripts/check_source.py
          python -m unittest discover -s tests -v

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routing.py src/app_config.py src/ProstoKVNNetwork.pyw src/ui/applications.py tests/test_smart_apps.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Smart Ubisoft routing and applications manager [skip ci]"
          git push origin HEAD:fix/smart-ubisoft-app-manager
