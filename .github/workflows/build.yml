name: Build and Release ProstoKVN Network

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Read version
        shell: powershell
        run: |
          $meta = Get-Content version.json -Raw | ConvertFrom-Json
          "APP_VERSION=$($meta.version)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Rebuild source archive
        shell: powershell
        run: |
          $partsDir = "release_payload/v${env:APP_VERSION}"
          $parts = Get-ChildItem $partsDir -Filter "part-*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -eq 0) {
            throw "Source archive parts not found: $partsDir"
          }

          $base64 = ($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }) -join ""

          $bytes = [Convert]::FromBase64String($base64)
          [IO.File]::WriteAllBytes("ProstoKVNNetwork_Source.zip", $bytes)

          $hash = (Get-FileHash "ProstoKVNNetwork_Source.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source size: $((Get-Item 'ProstoKVNNetwork_Source.zip').Length) bytes"
          Write-Host "Source SHA256: $hash"

      - name: Extract source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build_source | Out-Null
          Expand-Archive ProstoKVNNetwork_Source.zip build_source -Force

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          $src = "build_source/ProstoKVNNetwork"
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name ProstoKVNNetwork `
            --icon "branding/ProstoKVNNetwork.ico" `
            --version-file "packaging/version_info.txt" `
            --paths $src `
            "$src/ProstoKVNNetwork.pyw"

      - name: Validate SignPath config
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: powershell
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORG_ID = $env:SIGNPATH_ORG_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_POLICY_SLUG = $env:SIGNPATH_POLICY_SLUG
          }

          $missing = @()
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              $missing += $item.Key
            }
          }

          if ($missing.Count -gt 0) {
            throw "SignPath is enabled, but these values are missing: $($missing -join ', ')"
          }

          Write-Host "SignPath configuration is complete."

      - name: Upload unsigned EXE for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: ProstoKVN-Network-Unsigned
          path: dist/ProstoKVNNetwork.exe
          if-no-files-found: error

      - name: Sign EXE with SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed EXE
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: powershell
        run: |
          $signedExe = Get-ChildItem "signed" -Filter "ProstoKVNNetwork.exe" -Recurse | Select-Object -First 1
          if (-not $signedExe) {
            throw "SignPath completed, but ProstoKVNNetwork.exe was not returned."
          }

          Copy-Item $signedExe.FullName "dist/ProstoKVNNetwork.exe" -Force
          Write-Host "Signed EXE copied to dist/ProstoKVNNetwork.exe"

      - name: Verify Authenticode signature
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: powershell
        run: |
          $signature = Get-AuthenticodeSignature "dist/ProstoKVNNetwork.exe"
          Write-Host "Signature status: $($signature.Status)"

          if ($signature.SignerCertificate) {
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
            Write-Host "Certificate expires: $($signature.SignerCertificate.NotAfter)"
          }

          if ($signature.TimeStamperCertificate) {
            Write-Host "Timestamp signer: $($signature.TimeStamperCertificate.Subject)"
          }

          if ($signature.Status -ne 'Valid') {
            throw "The executable does not have a valid Authenticode signature."
          }

      - name: Unsigned build notice
        if: ${{ vars.SIGNPATH_ENABLED != 'true' }}
        shell: powershell
        run: |
          Write-Warning "SignPath OSS signing is not configured yet."
          Write-Warning "The EXE will be available only as a CI artifact. Public Release is skipped."

      - name: Create hashes
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/ProstoKVNNetwork.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ProstoKVNNetwork.exe" | Out-File -Encoding ascii dist/ProstoKVNNetwork.exe.sha256

          $sourceHash = (Get-FileHash ProstoKVNNetwork_Source.zip -Algorithm SHA256).Hash.ToLower()
          "$sourceHash  ProstoKVNNetwork_Source.zip" | Out-File -Encoding ascii ProstoKVNNetwork_Source.zip.sha256

      - name: Upload final build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProstoKVN-Network-Windows
          path: |
            dist/ProstoKVNNetwork.exe
            dist/ProstoKVNNetwork.exe.sha256
            ProstoKVNNetwork_Source.zip
            ProstoKVNNetwork_Source.zip.sha256

      - name: Publish signed GitHub Release
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $env:RELEASE_TAG = $tag
          cmd.exe /c "gh release view %RELEASE_TAG% >nul 2>nul"
          $releaseExists = ($LASTEXITCODE -eq 0)

          if (-not $releaseExists) {
            gh release create $tag `
              dist/ProstoKVNNetwork.exe `
              dist/ProstoKVNNetwork.exe.sha256 `
              ProstoKVNNetwork_Source.zip `
              ProstoKVNNetwork_Source.zip.sha256 `
              --title "ProstoKVN Network $tag" `
              --notes-file RELEASE_NOTES.md `
              --target $env:GITHUB_SHA
          } else {
            gh release upload $tag `
              dist/ProstoKVNNetwork.exe `
              dist/ProstoKVNNetwork.exe.sha256 `
              ProstoKVNNetwork_Source.zip `
              ProstoKVNNetwork_Source.zip.sha256 `
              --clobber
          }
