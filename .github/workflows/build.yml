name: Build ProstoKVN Network

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.22-improvements
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply v0.22 GUI migration
        if: ${{ github.ref == 'refs/heads/v0.22-improvements' || github.head_ref == 'v0.22-improvements' }}
        shell: powershell
        run: |
          python tools/apply_gui_v022.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProstoKVNNetwork.pyw
          if (git status --porcelain) {
            git commit -m "Apply v0.22 GUI refactor [skip ci]"
            git push origin HEAD:v0.22-improvements
          }

      - name: Read version
        shell: powershell
        run: |
          $meta = Get-Content version.json -Raw | ConvertFrom-Json
          "APP_VERSION=$($meta.version)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check source
        shell: powershell
        run: python scripts/check_source.py

      - name: Run unit tests
        shell: powershell
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($tagVersion -ne $env:APP_VERSION) {
            throw "Tag version $tagVersion does not match version.json ($env:APP_VERSION)."
          }

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name ProstoKVNNetwork `
            --icon "src/assets/ProstoKVNNetwork.ico" `
            --version-file "src/version_info.txt" `
            --paths "src" `
            "src/ProstoKVNNetwork.pyw"

      - name: Create source archive
        shell: powershell
        run: |
          $sourceFiles = @(
            "src",
            "scripts",
            "tests",
            "docs",
            "requirements.txt",
            "README.md",
            "LICENSE",
            "PRIVACY.md",
            "THIRD_PARTY.md",
            "CODE_SIGNING_POLICY.md",
            "SIGNING.md",
            "version.json",
            "RELEASE_NOTES.md",
            ".editorconfig",
            ".gitattributes",
            ".github/workflows/build.yml"
          )
          Compress-Archive -Path $sourceFiles -DestinationPath ProstoKVNNetwork_Source.zip -Force

      - name: Validate SignPath config
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORG_ID = $env:SIGNPATH_ORG_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_POLICY_SLUG = $env:SIGNPATH_POLICY_SLUG
          }

          $missing = @()
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              $missing += $item.Key
            }
          }

          if ($missing.Count -gt 0) {
            throw "SignPath is enabled, but these values are missing: $($missing -join ', ')"
          }

      - name: Upload unsigned EXE for SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: ProstoKVN-Network-Unsigned
          path: dist/ProstoKVNNetwork.exe
          if-no-files-found: error

      - name: Sign EXE with SignPath
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed EXE
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        run: |
          $signedExe = Get-ChildItem "signed" -Filter "ProstoKVNNetwork.exe" -Recurse | Select-Object -First 1
          if (-not $signedExe) {
            throw "SignPath completed, but ProstoKVNNetwork.exe was not returned."
          }
          Copy-Item $signedExe.FullName "dist/ProstoKVNNetwork.exe" -Force

      - name: Verify Authenticode signature
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        run: |
          $signature = Get-AuthenticodeSignature "dist/ProstoKVNNetwork.exe"
          Write-Host "Signature status: $($signature.Status)"
          if ($signature.SignerCertificate) {
            Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          }
          if ($signature.Status -ne 'Valid') {
            throw "The executable does not have a valid Authenticode signature."
          }

      - name: Create hashes
        shell: powershell
        run: |
          $exeHash = (Get-FileHash dist/ProstoKVNNetwork.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  ProstoKVNNetwork.exe" | Out-File -Encoding ascii dist/ProstoKVNNetwork.exe.sha256

          $sourceHash = (Get-FileHash ProstoKVNNetwork_Source.zip -Algorithm SHA256).Hash.ToLower()
          "$sourceHash  ProstoKVNNetwork_Source.zip" | Out-File -Encoding ascii ProstoKVNNetwork_Source.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProstoKVN-Network-Windows
          path: |
            dist/ProstoKVNNetwork.exe
            dist/ProstoKVNNetwork.exe.sha256
            ProstoKVNNetwork_Source.zip
            ProstoKVNNetwork_Source.zip.sha256

      - name: Unsigned build notice
        if: ${{ vars.SIGNPATH_ENABLED != 'true' || !startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        run: |
          Write-Host "This is a CI build. Public Release is skipped."
          Write-Host "A public release requires a v* tag and SignPath signing."

      - name: Publish signed GitHub Release
        if: ${{ vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if (-not $releaseExists) {
            gh release create $tag `
              dist/ProstoKVNNetwork.exe `
              dist/ProstoKVNNetwork.exe.sha256 `
              ProstoKVNNetwork_Source.zip `
              ProstoKVNNetwork_Source.zip.sha256 `
              --title "ProstoKVN Network $tag" `
              --notes-file RELEASE_NOTES.md `
              --target $env:GITHUB_SHA
          } else {
            gh release upload $tag `
              dist/ProstoKVNNetwork.exe `
              dist/ProstoKVNNetwork.exe.sha256 `
              ProstoKVNNetwork_Source.zip `
              ProstoKVNNetwork_Source.zip.sha256 `
              --clobber
          }
