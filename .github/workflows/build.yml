name: Apply ProstoKVN Network v0.21 refactor

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refactor source tree
        shell: powershell
        run: |
          python tools/refactor_v021.py
          python -m compileall -q src

      - name: Restore release workflow
        shell: powershell
        run: |
          Copy-Item tools/build_v021.yml .github/workflows/build.yml -Force
          Remove-Item .github/workflows/refactor-v021.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .refactor-v021-trigger -Force -ErrorAction SilentlyContinue
          Remove-Item tools/refactor_v021.py -Force
          Remove-Item tools/build_v021.yml -Force

      - name: Commit v0.21 refactor
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor source modules for v0.21.0"
          git push origin HEAD:main
